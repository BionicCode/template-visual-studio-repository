name: Sync managed files

on:
  workflow_call:
    inputs:
      event_name:
        description: "Original event name forwarded by the maintenance orchestrator."
        required: true
        type: string
      ref_name:
        description: "Original branch or ref name forwarded by the maintenance orchestrator."
        required: true
        type: string
      default_branch:
        description: "Repository default branch name."
        required: false
        type: string
      base_ref:
        description: "Pull request base branch name, when the original event was pull_request."
        required: false
        type: string
      head_ref:
        description: "Pull request head branch name, when the original event was pull_request. Used for concurrency only."
        required: false
        type: string
      pull_request_number:
        description: "Pull request number, when the original event was pull_request. Used for concurrency only."
        required: false
        type: string
    secrets:
      SOURCE_REPO_READ_TOKEN:
        description: "Token used by the shared sync workflow to read source repositories."
        required: false

  workflow_dispatch:
    inputs:
      event_name:
        description: "Effective event name for this manual run."
        required: false
        default: "workflow_dispatch"
        type: string
      ref_name:
        description: "Effective branch/ref name. Leave empty to use the selected workflow ref."
        required: false
        default: ""
        type: string
      default_branch:
        description: "Repository default branch name. Leave empty to use repository metadata."
        required: false
        default: ""
        type: string
      base_ref:
        description: "Optional pull request base branch name."
        required: false
        default: ""
        type: string
      head_ref:
        description: "Optional pull request head branch name. Used for concurrency only."
        required: false
        default: ""
        type: string
      pull_request_number:
        description: "Optional pull request number. Used for concurrency only."
        required: false
        default: ""
        type: string

concurrency:
  group: sync-managed-files-${{ github.repository }}-${{ inputs.event_name || github.event_name }}-${{ inputs.pull_request_number || inputs.head_ref || inputs.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  reject-non-default-manual-run:
    if: >
      (inputs.event_name || github.event_name) == 'workflow_dispatch' &&
      (inputs.ref_name || github.ref_name) != (inputs.default_branch || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Report invalid manual branch
        shell: bash
        run: |
          echo "::error::Manifest initialization must be run from the repository default branch."
          exit 1

  inspect-manifest:
    if: >
      (inputs.event_name || github.event_name) == 'schedule' ||
      ((inputs.event_name || github.event_name) == 'push' && (inputs.ref_name || github.ref_name) == (inputs.default_branch || github.event.repository.default_branch)) ||
      ((inputs.event_name || github.event_name) == 'pull_request' && (inputs.base_ref || github.base_ref) == (inputs.default_branch || github.event.repository.default_branch)) ||
      ((inputs.event_name || github.event_name) == 'workflow_dispatch' && (inputs.ref_name || github.ref_name) == (inputs.default_branch || github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest_exists: ${{ steps.inspect.outputs.manifest_exists }}
      manifest_json: ${{ steps.inspect.outputs.manifest_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect caller manifest
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          manifest_path=".github/tools/sync-config/sync-manifest.json"

          if [ ! -f "$manifest_path" ]; then
            echo "manifest_exists=false" >> "$GITHUB_OUTPUT"
            echo "Manifest not found at $manifest_path."
            exit 0
          fi

          echo "manifest_exists=true" >> "$GITHUB_OUTPUT"
          {
            echo "manifest_json<<__SYNC_MANIFEST_JSON__"
            cat "$manifest_path"
            echo "__SYNC_MANIFEST_JSON__"
          } >> "$GITHUB_OUTPUT"
          echo "Manifest found at $manifest_path."

  fail-missing-manifest-on-pr:
    needs: inspect-manifest
    if: >
      (inputs.event_name || github.event_name) == 'pull_request' &&
      needs.inspect-manifest.outputs.manifest_exists != 'true'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Report missing PR manifest
        shell: bash
        run: |
          echo "::error::.github/tools/sync-config/sync-manifest.json is missing. Run workflow_dispatch from the repository default branch or let a default-branch push/schedule initialize it."
          exit 1

  init-managed-file-sync:
    needs: inspect-manifest
    if: >
      needs.inspect-manifest.outputs.manifest_exists != 'true' &&
      (inputs.event_name || github.event_name) != 'pull_request' &&
      ((inputs.event_name || github.event_name) == 'schedule' || (inputs.ref_name || github.ref_name) == (inputs.default_branch || github.event.repository.default_branch))
    permissions:
      contents: write
      pull-requests: write
    uses: BionicCode/workflows/.github/workflows/sync-files-from-manifest.yml@main
    with:
      command: init

  sync-managed-files:
    needs: inspect-manifest
    if: needs.inspect-manifest.outputs.manifest_exists == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: BionicCode/workflows/.github/workflows/sync-files-from-manifest.yml@main
    with:
      command: sync
      manifest_json: ${{ needs.inspect-manifest.outputs.manifest_json }}
    secrets:
      source_token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
