name: Document metadata

on:
  workflow_call:
    inputs:
      event_name:
        description: "Original event name forwarded by the maintenance orchestrator."
        required: true
        type: string
      ref_name:
        description: "Original branch or ref name forwarded by the maintenance orchestrator."
        required: true
        type: string
      default_branch:
        description: "Repository default branch name."
        required: false
        type: string
      head_sha:
        description: "Original head SHA forwarded by the maintenance orchestrator."
        required: true
        type: string
      base_sha:
        description: "Pull request base SHA, when the original event was pull_request."
        required: false
        type: string
      before_sha:
        description: "Push before SHA, when the original event was push."
        required: false
        type: string
      base_ref:
        description: "Pull request base branch name, when the original event was pull_request."
        required: false
        type: string
      head_ref:
        description: "Pull request head branch name, when the original event was pull_request."
        required: false
        type: string
      head_repository:
        description: "Repository containing the head commit."
        required: true
        type: string
    outputs:
      metadata_valid:
        description: "Whether governed document metadata is valid after analysis."
        value: ${{ jobs.analyze-document-metadata.outputs.metadata_valid }}
      repair_required:
        description: "Whether analysis found safely repairable metadata."
        value: ${{ jobs.analyze-document-metadata.outputs.repair_required }}
      repair_safe:
        description: "Whether detected metadata issues are safe to repair automatically."
        value: ${{ jobs.analyze-document-metadata.outputs.repair_safe }}
      unrecoverable_failure:
        description: "Whether analysis found unrecoverable metadata failures."
        value: ${{ jobs.analyze-document-metadata.outputs.unrecoverable_failure }}
      repaired_files:
        description: "Comma-separated list of files repaired by the repair job."
        value: ${{ jobs.repair-document-metadata.outputs.repaired_files }}
      remaining_failed_files:
        description: "Comma-separated list of files still failing after repair."
        value: ${{ jobs.repair-document-metadata.outputs.remaining_failed_files }}
      remaining_unrecoverable_files:
        description: "Comma-separated list of unrecoverable files still present after repair."
        value: ${{ jobs.repair-document-metadata.outputs.remaining_unrecoverable_files }}

  workflow_dispatch:
    inputs:
      event_name:
        description: "Effective event name for this manual run."
        required: false
        default: "workflow_dispatch"
        type: string
      ref_name:
        description: "Effective branch/ref name. Leave empty to use the selected workflow ref."
        required: false
        default: ""
        type: string
      default_branch:
        description: "Repository default branch name. Leave empty to use repository metadata."
        required: false
        default: ""
        type: string
      head_sha:
        description: "Effective head SHA. Leave empty to use the selected workflow SHA."
        required: false
        default: ""
        type: string
      base_sha:
        description: "Optional pull request base SHA."
        required: false
        default: ""
        type: string
      before_sha:
        description: "Optional push before SHA."
        required: false
        default: ""
        type: string
      base_ref:
        description: "Optional pull request base branch name."
        required: false
        default: ""
        type: string
      head_ref:
        description: "Optional pull request head branch name."
        required: false
        default: ""
        type: string
      head_repository:
        description: "Repository containing the head commit. Leave empty to use this repository."
        required: false
        default: ""
        type: string

concurrency:
  group: document-metadata-${{ inputs.event_name || github.event_name }}-${{ inputs.head_repository || github.repository }}-${{ inputs.head_ref || inputs.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-document-metadata:
    name: Analyze document metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      metadata_valid: ${{ steps.publish_outputs.outputs.metadata_valid }}
      repair_required: ${{ steps.publish_outputs.outputs.repair_required }}
      repair_safe: ${{ steps.publish_outputs.outputs.repair_safe }}
      unrecoverable_failure: ${{ steps.publish_outputs.outputs.unrecoverable_failure }}
      report_path: ${{ steps.publish_outputs.outputs.report_path }}

    steps:
      - name: Checkout trusted scripts for pull request
        if: (inputs.event_name || github.event_name) == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted scripts for trusted branch
        if: (inputs.event_name || github.event_name) != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default_branch || github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout working files for pull request
        if: (inputs.event_name || github.event_name) == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.head_repository }}
          ref: ${{ inputs.head_sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure pull request comparison SHAs are fetchable
        if: (inputs.event_name || github.event_name) == 'pull_request'
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add base "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags base "+refs/heads/${{ inputs.base_ref }}:refs/remotes/base/${{ inputs.base_ref }}"
          git cat-file -e "${{ inputs.base_sha }}^{commit}"
          git cat-file -e "${{ inputs.head_sha }}^{commit}"
          git merge-base "${{ inputs.base_sha }}" "${{ inputs.head_sha }}" >/dev/null

      - name: Checkout working files for branch event
        if: (inputs.event_name || github.event_name) != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Write effective event payload
        id: invocation
        shell: pwsh
        env:
          DOC_METADATA_EVENT_NAME: ${{ inputs.event_name || github.event_name }}
          DOC_METADATA_BASE_SHA: ${{ inputs.base_sha }}
          DOC_METADATA_HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          DOC_METADATA_BEFORE_SHA: ${{ inputs.before_sha }}
          DOC_METADATA_BASE_REF: ${{ inputs.base_ref }}
          DOC_METADATA_HEAD_REF: ${{ inputs.head_ref }}
          DOC_METADATA_REF_NAME: ${{ inputs.ref_name || github.ref_name }}
          DOC_METADATA_HEAD_REPOSITORY: ${{ inputs.head_repository || github.repository }}
        run: |
          $payloadPath = Join-Path $env:GITHUB_WORKSPACE "doc-metadata-effective-event.json"
          $payloadRef = $null
          if (-not [string]::IsNullOrWhiteSpace($env:DOC_METADATA_REF_NAME)) {
            $payloadRef = "refs/heads/$($env:DOC_METADATA_REF_NAME)"
          }

          $payload = [ordered]@{
            before = $env:DOC_METADATA_BEFORE_SHA
            after = $env:DOC_METADATA_HEAD_SHA
            ref = $payloadRef
            pull_request = [ordered]@{
              base = [ordered]@{
                sha = $env:DOC_METADATA_BASE_SHA
                ref = $env:DOC_METADATA_BASE_REF
              }
              head = [ordered]@{
                sha = $env:DOC_METADATA_HEAD_SHA
                ref = $env:DOC_METADATA_HEAD_REF
                repo = [ordered]@{
                  full_name = $env:DOC_METADATA_HEAD_REPOSITORY
                }
              }
            }
          }

          $payload | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath $payloadPath -Encoding utf8NoBOM
          "event_name=$($env:DOC_METADATA_EVENT_NAME)" >> $env:GITHUB_OUTPUT
          "event_payload_path=$payloadPath" >> $env:GITHUB_OUTPUT
          "head_sha=$($env:DOC_METADATA_HEAD_SHA)" >> $env:GITHUB_OUTPUT
          "base_sha=$($env:DOC_METADATA_BASE_SHA)" >> $env:GITHUB_OUTPUT
          "before_sha=$($env:DOC_METADATA_BEFORE_SHA)" >> $env:GITHUB_OUTPUT
          "base_ref=$($env:DOC_METADATA_BASE_REF)" >> $env:GITHUB_OUTPUT
          "head_ref=$($env:DOC_METADATA_HEAD_REF)" >> $env:GITHUB_OUTPUT
          "ref_name=$($env:DOC_METADATA_REF_NAME)" >> $env:GITHUB_OUTPUT
          "head_repository=$($env:DOC_METADATA_HEAD_REPOSITORY)" >> $env:GITHUB_OUTPUT

      - name: Analyze document metadata
        shell: pwsh
        working-directory: work
        run: |
          ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 `
            -Mode Analyze `
            -Root . `
            -EventName "${{ steps.invocation.outputs.event_name }}" `
            -EventPayloadPath "${{ steps.invocation.outputs.event_payload_path }}" `
            -HeadSha "${{ inputs.head_sha || github.sha }}" `
            -ReportOutputPath doc-metadata-analyze-report.json

      - name: Publish analyze outputs
        id: publish_outputs
        shell: pwsh
        working-directory: work
        run: |
          $reportPath = "doc-metadata-analyze-report.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            "metadata_valid=false" >> $env:GITHUB_OUTPUT
            "repair_required=false" >> $env:GITHUB_OUTPUT
            "repair_safe=false" >> $env:GITHUB_OUTPUT
            "unrecoverable_failure=true" >> $env:GITHUB_OUTPUT
            "report_path=$reportPath" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json -Depth 32
          "metadata_valid=$($report.analysis.metadataValid.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "repair_required=$($report.analysis.repairRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "repair_safe=$($report.analysis.repairSafe.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "unrecoverable_failure=$($report.analysis.unrecoverableFailure.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT

      - name: Report repair branch publishing guard
        if: >
          ((inputs.event_name || github.event_name) == 'pull_request' && startsWith(inputs.head_ref, 'codex/doc-metadata-repair/')) ||
          ((inputs.event_name || github.event_name) != 'pull_request' && startsWith(inputs.ref_name || github.ref_name, 'codex/doc-metadata-repair/'))
        shell: pwsh
        run: |
          "Repair publishing skipped because this run is already on a doc-metadata repair branch." >> $env:GITHUB_STEP_SUMMARY

  repair-document-metadata:
    name: Repair document metadata
    needs: analyze-document-metadata
    if: >
      needs.analyze-document-metadata.outputs.repair_required == 'true' &&
      needs.analyze-document-metadata.outputs.repair_safe == 'true' &&
      ((inputs.event_name || github.event_name) != 'pull_request' || (inputs.head_repository || github.repository) == github.repository) &&
      !(((inputs.event_name || github.event_name) == 'pull_request' && startsWith(inputs.head_ref, 'codex/doc-metadata-repair/')) ||
      ((inputs.event_name || github.event_name) != 'pull_request' && startsWith(inputs.ref_name || github.ref_name, 'codex/doc-metadata-repair/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      repaired_files: ${{ steps.post_check_outputs.outputs.repaired_files }}
      remaining_failed_files: ${{ steps.post_check_outputs.outputs.remaining_failed_files }}
      remaining_unrecoverable_files: ${{ steps.post_check_outputs.outputs.remaining_unrecoverable_files }}
    concurrency:
      group: codex-doc-metadata-repair-${{ inputs.head_ref || inputs.ref_name || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout trusted scripts for pull request
        if: (inputs.event_name || github.event_name) == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted scripts for trusted branch
        if: (inputs.event_name || github.event_name) != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default_branch || github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout same-repository pull request branch
        if: (inputs.event_name || github.event_name) == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.head_ref }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure pull request repair comparison SHAs are fetchable
        if: (inputs.event_name || github.event_name) == 'pull_request'
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add base "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags base "+refs/heads/${{ inputs.base_ref }}:refs/remotes/base/${{ inputs.base_ref }}"
          git cat-file -e "${{ inputs.base_sha }}^{commit}"
          git cat-file -e "${{ inputs.head_sha }}^{commit}"
          git merge-base "${{ inputs.base_sha }}" "${{ inputs.head_sha }}" >/dev/null

      - name: Checkout target branch for bot repair
        if: (inputs.event_name || github.event_name) != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref_name || github.ref_name }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bot repair branch
        id: branch
        if: (inputs.event_name || github.event_name) != 'pull_request'
        shell: pwsh
        working-directory: work
        run: |
          $targetBranch = "${{ inputs.ref_name || github.ref_name }}"
          $safeTarget = ($targetBranch -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          if ([string]::IsNullOrWhiteSpace($safeTarget)) {
            $safeTarget = "default"
          }
          if ($safeTarget.Length -gt 48) {
            $safeTarget = $safeTarget.Substring(0, 48).Trim('-')
          }
          $hashBytes = [System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($targetBranch))
          $hash = [System.Convert]::ToHexString($hashBytes).Substring(0, 12).ToLowerInvariant()

          $repairBranch = "codex/doc-metadata-repair/$safeTarget-$hash"
          git checkout -B $repairBranch
          "repair_branch=$repairBranch" >> $env:GITHUB_OUTPUT

      - name: Write effective event payload
        id: invocation
        shell: pwsh
        env:
          DOC_METADATA_EVENT_NAME: ${{ inputs.event_name || github.event_name }}
          DOC_METADATA_BASE_SHA: ${{ inputs.base_sha }}
          DOC_METADATA_HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          DOC_METADATA_BEFORE_SHA: ${{ inputs.before_sha }}
          DOC_METADATA_BASE_REF: ${{ inputs.base_ref }}
          DOC_METADATA_HEAD_REF: ${{ inputs.head_ref }}
          DOC_METADATA_REF_NAME: ${{ inputs.ref_name || github.ref_name }}
          DOC_METADATA_HEAD_REPOSITORY: ${{ inputs.head_repository || github.repository }}
        run: |
          $payloadPath = Join-Path $env:GITHUB_WORKSPACE "doc-metadata-effective-event.json"
          $payloadRef = $null
          if (-not [string]::IsNullOrWhiteSpace($env:DOC_METADATA_REF_NAME)) {
            $payloadRef = "refs/heads/$($env:DOC_METADATA_REF_NAME)"
          }

          $payload = [ordered]@{
            before = $env:DOC_METADATA_BEFORE_SHA
            after = $env:DOC_METADATA_HEAD_SHA
            ref = $payloadRef
            pull_request = [ordered]@{
              base = [ordered]@{
                sha = $env:DOC_METADATA_BASE_SHA
                ref = $env:DOC_METADATA_BASE_REF
              }
              head = [ordered]@{
                sha = $env:DOC_METADATA_HEAD_SHA
                ref = $env:DOC_METADATA_HEAD_REF
                repo = [ordered]@{
                  full_name = $env:DOC_METADATA_HEAD_REPOSITORY
                }
              }
            }
          }

          $payload | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath $payloadPath -Encoding utf8NoBOM
          "event_name=$($env:DOC_METADATA_EVENT_NAME)" >> $env:GITHUB_OUTPUT
          "event_payload_path=$payloadPath" >> $env:GITHUB_OUTPUT
          "head_sha=$($env:DOC_METADATA_HEAD_SHA)" >> $env:GITHUB_OUTPUT
          "base_sha=$($env:DOC_METADATA_BASE_SHA)" >> $env:GITHUB_OUTPUT
          "before_sha=$($env:DOC_METADATA_BEFORE_SHA)" >> $env:GITHUB_OUTPUT
          "base_ref=$($env:DOC_METADATA_BASE_REF)" >> $env:GITHUB_OUTPUT
          "head_ref=$($env:DOC_METADATA_HEAD_REF)" >> $env:GITHUB_OUTPUT
          "ref_name=$($env:DOC_METADATA_REF_NAME)" >> $env:GITHUB_OUTPUT
          "head_repository=$($env:DOC_METADATA_HEAD_REPOSITORY)" >> $env:GITHUB_OUTPUT

      - name: Analyze repairable files
        id: repair_paths
        shell: pwsh
        working-directory: work
        run: |
          $repairPathsPath = Join-Path $env:RUNNER_TEMP "doc-metadata-repair-paths.txt"

          ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 `
            -Mode Analyze `
            -Root . `
            -EventName "${{ steps.invocation.outputs.event_name }}" `
            -EventPayloadPath "${{ steps.invocation.outputs.event_payload_path }}" `
            -HeadSha "${{ inputs.head_sha || github.sha }}" `
            -ReportOutputPath doc-metadata-repair-analyze-report.json

          $report = Get-Content -LiteralPath doc-metadata-repair-analyze-report.json -Raw | ConvertFrom-Json -Depth 32
          $paths = @($report.analysis.repairableFiles | ForEach-Object { $_.path } | Sort-Object -Unique)
          $paths | Set-Content -LiteralPath $repairPathsPath -Encoding utf8NoBOM
          "repair_paths_path=$repairPathsPath" >> $env:GITHUB_OUTPUT

      - name: Resolve content-change links
        id: content_links
        shell: pwsh
        working-directory: work
        run: |
          $linkMapPath = Join-Path $env:RUNNER_TEMP "doc-metadata-links.json"

          ../trusted/.github/scripts/doc-metadata/resolve-content-change-links.ps1 `
            -Root . `
            -MetadataScriptPath ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 `
            -PathListPath "${{ steps.repair_paths.outputs.repair_paths_path }}" `
            -EventName "${{ steps.invocation.outputs.event_name }}" `
            -EventPayloadPath "${{ steps.invocation.outputs.event_payload_path }}" `
            -Repository "${{ github.repository }}" `
            -ServerUrl "${{ github.server_url }}" `
            -OutputPath $linkMapPath

          "link_map_path=$linkMapPath" >> $env:GITHUB_OUTPUT

      - name: Repair document metadata
        id: repair
        shell: pwsh
        working-directory: work
        run: |
          $repairPathsPath = "${{ steps.repair_paths.outputs.repair_paths_path }}"
          $linkMapPath = "${{ steps.content_links.outputs.link_map_path }}"

          $paths = @(Get-Content -LiteralPath $repairPathsPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($paths.Count -eq 0) {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 `
            -Mode Update `
            -Root . `
            -Path $paths `
            -EventName "${{ steps.invocation.outputs.event_name }}" `
            -EventPayloadPath "${{ steps.invocation.outputs.event_payload_path }}" `
            -HeadSha "${{ inputs.head_sha || github.sha }}" `
            -HistoryLinkMapPath $linkMapPath `
            -ChangedFilesOutputPath doc-metadata-changed-files.json `
            -ReportOutputPath doc-metadata-repair-report.json

          $changed = Get-Content -LiteralPath doc-metadata-changed-files.json -Raw | ConvertFrom-Json
          if (@($changed.changedFiles).Count -eq 0) {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          foreach ($path in @($changed.changedFiles)) {
            git add -- "$path"
          }
          git commit -m "chore(doc-metadata): repair governed metadata"
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Post-repair Check
        id: post_check
        continue-on-error: true
        shell: pwsh
        working-directory: work
        run: |
          $head = (git rev-parse HEAD).Trim()
          $base = $null
          if ("${{ steps.invocation.outputs.event_name }}" -eq "pull_request") {
            $eventBase = "${{ inputs.base_sha }}"
            $base = (git merge-base $eventBase $head).Trim()
          }
          elseif ("${{ steps.invocation.outputs.event_name }}" -eq "push") {
            $payload = Get-Content -LiteralPath "${{ steps.invocation.outputs.event_payload_path }}" -Raw | ConvertFrom-Json -Depth 64
            if ($payload.before -and $payload.before -notmatch '^0{40}$') {
              $base = $payload.before
            }
          }

          if ([string]::IsNullOrWhiteSpace($base)) {
            ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 -Mode Check -Root . -ReportOutputPath doc-metadata-post-check-report.json
          }
          else {
            ../trusted/.github/scripts/doc-metadata/update-doc-metadata.ps1 -Mode Check -Root . -BaseSha $base -HeadSha $head -ReportOutputPath doc-metadata-post-check-report.json
          }

      - name: Publish post-repair Check outputs
        id: post_check_outputs
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          function Join-UniqueValues {
            param([object[]] $Values)
            (@($Values | Where-Object { -not [string]::IsNullOrWhiteSpace([string] $_) } | Sort-Object -Unique) -join ", ")
          }

          $repaired = @()
          if (Test-Path -LiteralPath doc-metadata-repair-report.json -PathType Leaf) {
            $repairReport = Get-Content -LiteralPath doc-metadata-repair-report.json -Raw | ConvertFrom-Json -Depth 32
            $repaired = @($repairReport.updatedFiles | ForEach-Object { $_.path })
          }

          $failed = @()
          $unrecoverable = @()
          if (Test-Path -LiteralPath doc-metadata-post-check-report.json -PathType Leaf) {
            $postReport = Get-Content -LiteralPath doc-metadata-post-check-report.json -Raw | ConvertFrom-Json -Depth 32
            $failed = @($postReport.failedFiles | ForEach-Object { $_.path })
            $unrecoverable = @($postReport.analysis.unrecoverableFiles | ForEach-Object { $_.path })
          }

          "repaired_files=$(Join-UniqueValues $repaired)" >> $env:GITHUB_OUTPUT
          "remaining_failed_files=$(Join-UniqueValues $failed)" >> $env:GITHUB_OUTPUT
          "remaining_unrecoverable_files=$(Join-UniqueValues $unrecoverable)" >> $env:GITHUB_OUTPUT

      - name: Build repair report summary
        id: repair_report_summary
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = "Stop"

          function ConvertTo-SafeCell {
            param([object] $Value)
            if ($null -eq $Value) { return "" }
            ([string] $Value).Replace("|", "\|")
          }

          function Add-Table {
            param(
              [System.Text.StringBuilder] $Builder,
              [string] $Title,
              [string[]] $Headers,
              [object[]] $Rows
            )

            [void] $Builder.AppendLine("## $Title")
            [void] $Builder.AppendLine()
            if ($Rows.Count -eq 0) {
              [void] $Builder.AppendLine("_None_")
              [void] $Builder.AppendLine()
              return
            }

            [void] $Builder.AppendLine("| $($Headers -join " | ") |")
            [void] $Builder.AppendLine("| $((@($Headers | ForEach-Object { "---" })) -join " | ") |")
            foreach ($row in $Rows) {
              $values = foreach ($header in $Headers) {
                ConvertTo-SafeCell $row.$header
              }
              [void] $Builder.AppendLine("| $($values -join " | ") |")
            }
            [void] $Builder.AppendLine()
          }

          $repairReport = $null
          if (Test-Path -LiteralPath doc-metadata-repair-report.json -PathType Leaf) {
            $repairReport = Get-Content -LiteralPath doc-metadata-repair-report.json -Raw | ConvertFrom-Json -Depth 32
          }

          $postReport = $null
          if (Test-Path -LiteralPath doc-metadata-post-check-report.json -PathType Leaf) {
            $postReport = Get-Content -LiteralPath doc-metadata-post-check-report.json -Raw | ConvertFrom-Json -Depth 32
          }

          $incrementedRows = @()
          $initializedRows = @()
          $metadataRepairRows = @()
          $skippedRows = @()
          if ($null -ne $repairReport) {
            $initializedRows = @($repairReport.updatedFiles | Where-Object { $_.reason -match "initialized|new governed file|missing metadata" } | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                NewVersion = $_.newVersion
                Reason = $_.reason
              }
            })
            $incrementedRows = @($repairReport.updatedFiles | Where-Object { $_.reason -match "body changed" } | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                OldVersion = $_.oldVersion
                NewVersion = $_.newVersion
                Reason = $_.reason
              }
            })
            $metadataRepairRows = @($repairReport.updatedFiles | Where-Object {
              $_.reason -notmatch "initialized|new governed file|missing metadata" -and $_.reason -notmatch "body changed"
            } | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                OldVersion = $_.oldVersion
                NewVersion = $_.newVersion
                Reason = $_.reason
              }
            })
            $skippedRows = @($repairReport.skippedFiles | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                Reason = $_.reason
              }
            })
          }

          $failedRows = @()
          $unrecoverableRows = @()
          if ($null -ne $postReport) {
            $failedRows = @($postReport.failedFiles | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                Rule = $_.rule
                Expected = $_.expected
              }
            })
            $unrecoverableRows = @($postReport.analysis.unrecoverableFiles | ForEach-Object {
              [pscustomobject]@{
                Path = $_.path
                Reason = $_.reason
                Expected = $_.expected
              }
            })
          }

          $repairCommitSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git rev-parse HEAD failed."
          }

          $repairBranch = if ("${{ steps.invocation.outputs.event_name }}" -eq "pull_request") {
            "${{ inputs.head_ref }}"
          }
          else {
            "${{ steps.branch.outputs.repair_branch }}"
          }
          $targetBranch = if ("${{ steps.invocation.outputs.event_name }}" -eq "pull_request") {
            "${{ inputs.base_ref }}"
          }
          else {
            "${{ inputs.ref_name || github.ref_name }}"
          }

          $builder = [System.Text.StringBuilder]::new()
          [void] $builder.AppendLine("# Document metadata repair report")
          [void] $builder.AppendLine()
          [void] $builder.AppendLine("This PR repairs repository-owned document metadata for governed files.")
          [void] $builder.AppendLine()
          [void] $builder.AppendLine("## Workflow run")
          [void] $builder.AppendLine()
          [void] $builder.AppendLine("- Workflow: ${{ github.workflow }}")
          [void] $builder.AppendLine("- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          [void] $builder.AppendLine("- Run ID: ${{ github.run_id }}")
          [void] $builder.AppendLine("- Run number: ${{ github.run_number }}")
          [void] $builder.AppendLine("- Event: ${{ steps.invocation.outputs.event_name }}")
          [void] $builder.AppendLine("- Actor: ${{ github.actor }}")
          [void] $builder.AppendLine("- Target branch: $targetBranch")
          [void] $builder.AppendLine("- Source SHA: ${{ inputs.head_sha || github.sha }}")
          [void] $builder.AppendLine("- Repair branch: $repairBranch")
          [void] $builder.AppendLine("- Repair commit SHA: $repairCommitSha")
          [void] $builder.AppendLine("- Post-repair Check result: ${{ steps.post_check.outcome }}")
          [void] $builder.AppendLine()
          [void] $builder.AppendLine("> [!IMPORTANT]")
          [void] $builder.AppendLine("> The repair commit was created by GitHub Actions using `GITHUB_TOKEN`. GitHub may not trigger every follow-up workflow from `GITHUB_TOKEN` commits, so this workflow runs its own post-repair Check and reports the result here.")
          [void] $builder.AppendLine()

          Add-Table -Builder $builder -Title "Incremented files" -Headers @("Path", "OldVersion", "NewVersion", "Reason") -Rows $incrementedRows
          Add-Table -Builder $builder -Title "Initialized files" -Headers @("Path", "NewVersion", "Reason") -Rows $initializedRows
          Add-Table -Builder $builder -Title "Metadata repair files" -Headers @("Path", "OldVersion", "NewVersion", "Reason") -Rows $metadataRepairRows
          Add-Table -Builder $builder -Title "Skipped files" -Headers @("Path", "Reason") -Rows $skippedRows
          Add-Table -Builder $builder -Title "Remaining failed files" -Headers @("Path", "Rule", "Expected") -Rows $failedRows
          Add-Table -Builder $builder -Title "Remaining unrecoverable files" -Headers @("Path", "Reason", "Expected") -Rows $unrecoverableRows

          $bodyPath = Join-Path $env:RUNNER_TEMP "doc-metadata-repair-summary.md"
          $builder.ToString() | Set-Content -LiteralPath $bodyPath -Encoding utf8NoBOM
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            Get-Content -LiteralPath $bodyPath -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Push repair to pull request branch
        if: (inputs.event_name || github.event_name) == 'pull_request' && steps.repair.outputs.changed == 'true'
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags "$remote_url" "+refs/heads/${{ inputs.head_ref }}:refs/remotes/origin/${{ inputs.head_ref }}"
          commit_count="$(git rev-list --count "origin/${{ inputs.head_ref }}..HEAD")"
          if [[ "$commit_count" == "0" ]]; then
            echo "No repair commits remain relative to the pull request branch; skipping repair push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push "$remote_url" "HEAD:${{ inputs.head_ref }}"

      - name: Push bot repair branch and create or update pull request
        id: bot_pr
        if: (inputs.event_name || github.event_name) != 'pull_request' && steps.repair.outputs.changed == 'true'
        shell: pwsh
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Native {
            param(
              [string] $FileName,
              [string[]] $Arguments,
              [switch] $AllowFailure
            )

            $output = & $FileName @Arguments 2>&1
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0 -and -not $AllowFailure) {
              throw "$FileName $($Arguments -join ' ') failed with exit code $exitCode.`n$($output -join "`n")"
            }

            @($output | ForEach-Object { [string] $_ })
          }

          $repairBranch = "${{ steps.branch.outputs.repair_branch }}"
          $targetBranch = "${{ inputs.ref_name || github.ref_name }}"
          $remoteUrl = "https://x-access-token:${env:GH_TOKEN}@github.com/${{ github.repository }}.git"
          $bodyPath = "${{ steps.repair_report_summary.outputs.body_path }}"
          if ([string]::IsNullOrWhiteSpace($bodyPath)) {
            $bodyPath = Join-Path $env:RUNNER_TEMP "doc-metadata-repair-summary.md"
          }

          Invoke-Native -FileName "git" -Arguments @("fetch", "--no-tags", $remoteUrl, "+refs/heads/${targetBranch}:refs/remotes/origin/$targetBranch")
          $commitCount = [int] ((Invoke-Native -FileName "git" -Arguments @("rev-list", "--count", "origin/$targetBranch..HEAD"))[0])
          if ($commitCount -eq 0) {
            "No repair commits remain relative to '$targetBranch'; skipping repair branch push and PR creation." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $remoteBranchState = Invoke-Native -FileName "git" -Arguments @("ls-remote", "--heads", $remoteUrl, $repairBranch)
          $remoteSha = $null
          if ($remoteBranchState.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace($remoteBranchState[0])) {
            $remoteSha = ($remoteBranchState[0] -split "\s+")[0]
          }

          if (-not [string]::IsNullOrWhiteSpace($remoteSha)) {
            Invoke-Native -FileName "git" -Arguments @("push", "--force-with-lease=refs/heads/${repairBranch}:$remoteSha", $remoteUrl, "HEAD:refs/heads/$repairBranch")
          }
          else {
            Invoke-Native -FileName "git" -Arguments @("push", $remoteUrl, "HEAD:refs/heads/$repairBranch")
          }

          Invoke-Native -FileName "git" -Arguments @("fetch", "--no-tags", $remoteUrl, "+refs/heads/${repairBranch}:refs/remotes/origin/$repairBranch")
          $publishedCommitCount = [int] ((Invoke-Native -FileName "git" -Arguments @("rev-list", "--count", "origin/$targetBranch..origin/$repairBranch"))[0])
          if ($publishedCommitCount -eq 0) {
            "No repair commits remain after publishing '$repairBranch'; skipping PR creation." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $existing = (Invoke-Native -FileName "gh" -Arguments @("pr", "list", "--head", $repairBranch, "--base", $targetBranch, "--json", "number", "--jq", ".[0].number")) -join ""
          if ([string]::IsNullOrWhiteSpace($existing)) {
            $created = Invoke-Native -FileName "gh" -Arguments @("pr", "create", "--head", $repairBranch, "--base", $targetBranch, "--title", "Repair document metadata", "--body-file", $bodyPath)
            $prUrl = ($created | Select-Object -Last 1)
          }
          else {
            Invoke-Native -FileName "gh" -Arguments @("pr", "edit", $existing, "--title", "Repair document metadata", "--body-file", $bodyPath) | Out-Null
            $prUrl = ((Invoke-Native -FileName "gh" -Arguments @("pr", "view", $existing, "--json", "url", "--jq", ".url")) | Select-Object -First 1)
          }

          if (-not [string]::IsNullOrWhiteSpace($prUrl)) {
            "Repair PR: $prUrl" >> $env:GITHUB_STEP_SUMMARY
            "pr_url=$prUrl" >> $env:GITHUB_OUTPUT
          }

      - name: Fail if post-repair Check failed
        if: steps.post_check.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "Post-repair Check found remaining governed metadata failures. Repaired files: ${{ steps.post_check_outputs.outputs.repaired_files }}. Remaining failed files: ${{ steps.post_check_outputs.outputs.remaining_failed_files }}. Remaining unrecoverable files: ${{ steps.post_check_outputs.outputs.remaining_unrecoverable_files }}."

  final-document-metadata-status:
    name: Document metadata final status
    needs:
      - analyze-document-metadata
      - repair-document-metadata
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Gate final status
        shell: pwsh
        run: |
          $metadataValid = "${{ needs.analyze-document-metadata.outputs.metadata_valid }}"
          $repairRequired = "${{ needs.analyze-document-metadata.outputs.repair_required }}"
          $repairSafe = "${{ needs.analyze-document-metadata.outputs.repair_safe }}"
          $unrecoverableFailure = "${{ needs.analyze-document-metadata.outputs.unrecoverable_failure }}"
          $repairResult = "${{ needs.repair-document-metadata.result }}"
          $repairedFiles = "${{ needs.repair-document-metadata.outputs.repaired_files }}"
          $remainingFailedFiles = "${{ needs.repair-document-metadata.outputs.remaining_failed_files }}"
          $remainingUnrecoverableFiles = "${{ needs.repair-document-metadata.outputs.remaining_unrecoverable_files }}"
          $isRepairBranch = "${{ ((inputs.event_name || github.event_name) == 'pull_request' && startsWith(inputs.head_ref, 'codex/doc-metadata-repair/')) || ((inputs.event_name || github.event_name) != 'pull_request' && startsWith(inputs.ref_name || github.ref_name, 'codex/doc-metadata-repair/')) }}"

          if ($unrecoverableFailure -eq "true") {
            Write-Error "Document metadata has unrecoverable failures. Review the analyze report."
          }
          elseif ($repairRequired -eq "true" -and $repairSafe -ne "true") {
            Write-Error "Document metadata repair is required but not safe."
          }
          elseif ($isRepairBranch -eq "true" -and $repairRequired -eq "true") {
            Write-Error "Repair publishing skipped because this run is already on a doc-metadata repair branch, but document metadata still requires repair. Review the analyze report for remaining governed files."
          }
          elseif ($repairRequired -eq "true" -and $repairResult -ne "success") {
            Write-Error "Document metadata repair was required but did not complete successfully. Result: $repairResult. Repaired files: $repairedFiles. Remaining invalid files: $remainingFailedFiles. Remaining unrecoverable files: $remainingUnrecoverableFiles."
          }
          elseif ($repairRequired -ne "true" -and $metadataValid -ne "true") {
            Write-Error "Document metadata is not valid and no safe repair was available."
          }
          else {
            Write-Host "Document metadata status is complete."
          }
